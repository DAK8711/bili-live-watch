name: bilibili-live-watch

on:
  schedule:
    # GitHub's minimum granularity. Expect 0-15 min of drift at busy times.
    - cron: "*/5 * * * *"
  workflow_dispatch: # lets you run it by hand to test
    inputs:
      test:
        description: "只发一条测试通知，不检查开播"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check live status
        env:
          # Room id is baked in so you don't have to create a secret for it.
          # Override with a BILI_ROOM_ID secret if you ever watch someone else.
          BILI_ROOM_ID: ${{ secrets.BILI_ROOM_ID || '14385974' }}
          BILI_NAME: ${{ secrets.BILI_NAME || '智力之外' }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SCT_KEY: ${{ secrets.SCT_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python watch.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}

      - name: Persist state
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name  "bili-live-watch[bot]"
          git config user.email "bili-live-watch@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
